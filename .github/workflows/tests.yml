name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -e ".[dev,all]"

      - name: Run tests
        run: venv/bin/python -m pytest

  runtime-migration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,keyferry,aikit,pluck]"
      - run: python -m pytest tests/test_external_runtime.py tests/test_manager_migration.py tests/test_manager_recovery.py tests/test_manager_legacy.py tests/test_manager_review.py
      - run: python tests/rehearse_runtime_migration.py
      - run: python tests/rehearse_generated_tool.py

  required-quality:
    if: always()
    needs: [test, runtime-migration]
    runs-on: ubuntu-latest
    steps:
      - name: Require full suite and all migration cells
        env:
          TEST: ${{ needs.test.result }}
          MIGRATION: ${{ needs.runtime-migration.result }}
        run: test "$TEST" = success && test "$MIGRATION" = success

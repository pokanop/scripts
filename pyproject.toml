[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokanop-scripts"
version = "1.2.0"
description = "Daily-use CLI utilities — medcat, keyferry, voxtract, netsy, pluck, aikit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pokanop-scriptkit @ https://github.com/pokanop/scriptkit/releases/download/v1.5.0/pokanop_scriptkit-1.5.0-py3-none-any.whl#sha256=89307e39af78f0c92d7002e60b30cf10e5015c35aaa5bc67b57b547822bdc75b",
    "pokanop-scriptkit>=1.5.0,<1.6",
    "rich>=13.9.4,<14",
    "requests",
]

[project.optional-dependencies]
medcat = ["ebooklib", "musicbrainzngs", "pymupdf", "yt-dlp"]
keyferry = ["readchar"]
aikit = ["flask", "readchar"]
pluck = ["ruamel.yaml", "tomli-w"]
netsy = []
voxtract = ["yt-dlp", "demucs", "spotipy", "spotdl"]
all = [
    "pokanop-scripts[medcat,keyferry,aikit,pluck,netsy,voxtract]",
]
dev = ["pytest>=7", "ruamel.yaml"]

[tool.setuptools]
py-modules = []
packages = ["pokanop_manager"]

[tool.setuptools.package-data]
pokanop_manager = ["catalog.json"]

[project.urls]
Homepage = "https://github.com/pokanop/scripts"
Repository = "https://github.com/pokanop/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
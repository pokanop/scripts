[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pokanop-scripts"
version = "1.3.0"
description = "Daily-use CLI utilities — medcat, keyferry, voxtract, netsy, pluck, aikit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "scripteer==2.0.0",
    "rich>=13.9.4,<14",
    "requests",
]

[project.optional-dependencies]
medcat = ["ebooklib", "musicbrainzngs", "pymupdf", "yt-dlp"]
keyferry = ["readchar"]
aikit = ["flask", "readchar"]
pluck = ["ruamel.yaml", "tomli-w"]
netsy = []
voxtract = ["yt-dlp", "demucs", "spotipy", "spotdl"]
all = [
    "pokanop-scripts[medcat,keyferry,aikit,pluck,netsy,voxtract]",
]
dev = ["pytest>=7", "ruamel.yaml"]

[tool.setuptools]
py-modules = []
packages = ["pokanop_manager"]

[tool.setuptools.package-data]
pokanop_manager = ["catalog.json"]

[project.urls]
Homepage = "https://github.com/pokanop/scripts"
Repository = "https://github.com/pokanop/scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]